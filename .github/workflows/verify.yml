name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    name: Application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            npm: npm
          - os: macos-15
            npm: npm
          - os: windows-2025
            npm: npm.cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: ${{ matrix.npm }} ci --ignore-scripts
      - run: ${{ matrix.npm }} run verify
      - name: Lazy upload resource check (server RSS)
        if: runner.os == 'Linux'
        run: npm run test:resources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            reports/
            coverage/
          if-no-files-found: warn
          retention-days: 7
  container:
    name: Linux container
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Container checks use Node built-ins; dependency installation happens in the images.
      - run: npm run test:container
      - name: Lazy upload resource check (container memory)
        run: npm run test:resources:container
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-resource-verification
          path: reports/
          if-no-files-found: warn
          retention-days: 7
